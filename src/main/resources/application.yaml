spring:
  application:
    name: walletledger

  # Load local development variables from .env as Java properties.
  config:
    import: "optional:file:.env[.properties]"

  # Use dev only when no profile has been explicitly activated.
  profiles:
    default: dev
walletledger:
  rate-limit:
    login:
      capacity: 10
      refill-tokens: 10
      refill-duration: PT1M
    money-movement:
      capacity: 30
      refill-tokens: 30
      refill-duration: PT1M

  reconciliation:
    enabled: false
    cron: "0 0 * * * *"
    lock-name: "walletledger:scheduled-reconciliation"
    lock-timeout-seconds: 0
