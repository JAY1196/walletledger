spring:
  datasource:

    hikari:
      pool-name: WalletLedgerTestHikari
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 3000
      validation-timeout: 1000
      transaction-isolation: TRANSACTION_READ_COMMITTED
      connection-init-sql: "SET SESSION time_zone = '+00:00', innodb_lock_wait_timeout = 5"

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  data:
    redis:
      host: "${TEST_REDIS_HOST:localhost}"
      port: ${TEST_REDIS_PORT:6380}
      connect-timeout: 2s
      timeout: 2s