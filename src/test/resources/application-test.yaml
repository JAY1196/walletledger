spring:
  datasource:

    hikari:
      pool-name: WalletLedgerTestHikari
      maximum-pool-size: 16
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 1000
      transaction-isolation: TRANSACTION_READ_COMMITTED
      connection-init-sql: "SET SESSION time_zone = '+00:00', innodb_lock_wait_timeout = 5"

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  data:
    redis:
      host: "${TEST_REDIS_HOST:localhost}"
      port: ${TEST_REDIS_PORT:6380}
      connect-timeout: 2s
      timeout: 2s
walletledger:
  security:
    jwt:
      secret: "dGVzdC1vbmx5LWtleS1mb3Itd2FsbGV0bGVkZ2VyLTIwMjYh"

  rate-limit:
    login:
      capacity: 100000
      refill-tokens: 100000
      refill-duration: PT1M
    money-movement:
      capacity: 100000
      refill-tokens: 100000
      refill-duration: PT1M
