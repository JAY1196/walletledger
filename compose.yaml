services:
  mysql:
    image: mysql:8.4
    container_name: walletledger-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-walletledger}
      MYSQL_OWNER_USER: ${MYSQL_OWNER_USER:?Set MYSQL_OWNER_USER in .env}
      MYSQL_OWNER_PASSWORD: ${MYSQL_OWNER_PASSWORD:?Set MYSQL_OWNER_PASSWORD in .env}
      MYSQL_APP_USER: ${MYSQL_APP_USER:?Set MYSQL_APP_USER in .env}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in .env}
      TZ: UTC
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --transaction-isolation=READ-COMMITTED
      - --innodb-lock-wait-timeout=5
      - --innodb-print-all-deadlocks=ON
      - --log-bin-trust-function-creators=ON
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    networks:
      - walletledger-network

  redis:
    image: redis:7
    container_name: walletledger-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - walletledger-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: walletledger-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_DATABASE: ${MYSQL_DATABASE:-walletledger}
      MYSQL_OWNER_USER: ${MYSQL_OWNER_USER:-walletledger_owner}
      MYSQL_OWNER_PASSWORD: ${MYSQL_OWNER_PASSWORD:?Set MYSQL_OWNER_PASSWORD in .env}
      MYSQL_APP_USER: ${MYSQL_APP_USER:-walletledger_app}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 60s
    networks:
      - walletledger-network

volumes:
  mysql_data:

networks:
  walletledger-network:
    driver: bridge
