name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Java 21 / Maven / Testcontainers
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SPRING_PROFILES_ACTIVE: test
      WALLETLEDGER_SECURITY_JWT_SECRET: dGVzdC1vbmx5LWtleS1mb3Itd2FsbGV0bGVkZ2VyLTIwMjYh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify
        run: ./mvnw -B verify

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/*.xml
          if-no-files-found: warn
          retention-days: 14
